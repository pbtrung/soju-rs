
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish archives as a GitHub Release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: cc

jobs:
  build:
    name: Build release archives
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40

    outputs:
      tag: ${{ steps.package.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install Arch Linux release toolchains
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            rust musl rust-musl gcc cmake make perl git

          rustc --version --verbose

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package and verify GNU and musl archives
        id: package
        run: |
          set -euo pipefail

          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"

          echo "Building release $tag"

          ./scripts/build-release.sh "$tag"

          cd dist

          sha256sum --check SHA256SUMS

          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT

          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl
          do
            name="soju-rs-$tag-$target"

            echo "Verifying $name"

            tar -xzf "$name.tar.gz" -C "$staging"

            "$staging/$name/soju" -version

            status=0
            help=$("$staging/$name/sojuctl" -help 2>&1) || status=$?

            test "$status" -eq 2
            grep -F 'usage: sojuctl' <<< "$help"
          done

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload release archives
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: soju-rs-${{ steps.package.outputs.tag }}-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 10

    permissions:
      contents: write

    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Install Arch Linux publishing tools
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            git github-cli ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail

          # Verify downloaded archives
          (cd dist && sha256sum --check SHA256SUMS)

          ref="refs/tags/$TAG"

          # Check tag using GitHub API, not git origin
          tag_json=""
          if tag_json=$(gh api \
            "repos/$GH_REPO/git/ref/tags/$TAG" 2>/dev/null); then

            existing_sha=$(jq -r '.object.sha' <<< "$tag_json")
            existing_type=$(jq -r '.object.type' <<< "$tag_json")

            # Dereference annotated tags when necessary
            if [[ "$existing_type" == "tag" ]]; then
              existing_sha=$(gh api \
                "repos/$GH_REPO/git/tags/$existing_sha" \
                --jq '.object.sha')
            fi

            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "ERROR: $TAG points to another commit" >&2
              echo "Expected: $GITHUB_SHA" >&2
              echo "Existing: $existing_sha" >&2
              exit 1
            fi

            echo "Tag $TAG already exists at $GITHUB_SHA"

          else
            echo "Creating tag $TAG at $GITHUB_SHA"

            gh api \
              --method POST \
              "repos/$GH_REPO/git/refs" \
              -f ref="$ref" \
              -f sha="$GITHUB_SHA"
          fi

          # Prevent accidental release overwrite
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG already exists" >&2
            exit 1
          fi

          # Publish release
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "dist/soju-rs-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/soju-rs-$TAG-x86_64-unknown-linux-musl.tar.gz" \
            dist/SHA256SUMS
