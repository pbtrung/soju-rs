name: C port
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [gnu, musl]
        compiler: [gcc, clang]
        mode: [debug, release, ubsan-trap, valgrind, asan, tsan, msan, fuzz]
        exclude:
          - {target: musl, mode: asan}
          - {target: musl, mode: tsan}
          - {target: musl, mode: msan}
          - {target: musl, mode: fuzz}
          - {compiler: gcc, mode: msan}
          - {compiler: gcc, mode: fuzz}
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: tools/docker-test.sh '${{ matrix.target }}' '${{ matrix.compiler }}-${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.target }}-${{ matrix.compiler }}-${{ matrix.mode }}
          path: |
            build/docker/*/ci-*.log
            build/docker/*/*/ci-*.xml
