name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the archives as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CC_x86_64_unknown_linux_musl: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: cc

jobs:
  test:
    name: Test ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            packages: go python nodejs npm chromium socat
            libsql: ghcr.io/tursodatabase/libsql-server@sha256:6dd3eb276d9d3604e4a48ac4a999a2e267814732d57d7e94c04ba71482333a67
          - target: x86_64-unknown-linux-musl
            packages: musl rust-musl
            libsql: ''
    services:
      libsql:
        image: ${{ matrix.libsql }}
        env:
          SQLD_NODE: primary
    env:
      TARGET: ${{ matrix.target }}
      COMPAT_WORK: /tmp/soju-compat

    steps:
      - name: Install Arch Linux toolchain
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          pacman -Syu --noconfirm --needed rust gcc cmake make perl git "${packages[@]}"
          rustc --version --verbose

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Rust tests
        run: |
          cargo test --locked --all-targets --target "$TARGET"
          cargo test --locked --doc --target "$TARGET"

      - name: Test query cost against libSQL
        if: matrix.libsql != ''
        run: |
          # The test accepts only loopback URLs. Forward to the service container.
          timeout 30 bash -c 'until (: >/dev/tcp/libsql/8080) 2>/dev/null; do sleep 1; done'
          socat TCP-LISTEN:8080,bind=127.0.0.1,reuseaddr,fork TCP:libsql:8080 &
          trap 'kill "$!"' EXIT
          timeout 10 bash -c 'until (: >/dev/tcp/127.0.0.1/8080) 2>/dev/null; do sleep 0.1; done'
          SOJU_QUERY_COST_URL=http://127.0.0.1:8080/v2/pipeline \
            cargo test --locked --lib --target "$TARGET" real_engine_query_cost -- --ignored

      - name: Prepare compatibility tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: tests/compat/setup.sh

      - name: Run compatibility tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: tests/compat
        run: |
          export RSBIN="$GITHUB_WORKSPACE/target/$TARGET/debug"
          export RS_BIN="$RSBIN"
          ./run-diff.sh
          ./env-up.sh
          python3 ircv3spec.py 16670 16667
          python3 plumbing.py rs
          ./run-gamja.sh rs go

      - name: Upload compatibility diagnostics
        if: failure() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-diagnostics
          path: |
            /tmp/soju-compat/*.txt
            /tmp/soju-compat/env/*/*.log
            /tmp/soju-compat/gamja/test-results-*
          if-no-files-found: ignore

  build:
    name: Build release archives
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Install Arch Linux toolchains
        run: |
          pacman -Syu --noconfirm --needed rust musl rust-musl gcc cmake make perl git
          rustc --version --verbose

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package and verify GNU and musl archives
        id: package
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          ./scripts/build-release.sh "$tag"
          cd dist
          sha256sum --check SHA256SUMS
          staging=$(mktemp -d)
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl; do
            name="soju-rs-$tag-$target"
            tar -xzf "$name.tar.gz" -C "$staging"
            "$staging/$name/soju" -version
            status=0
            help=$("$staging/$name/sojuctl" -help 2>&1) || status=$?
            test "$status" -eq 2
            grep -F 'usage: sojuctl' <<< "$help"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload release archives
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: soju-rs-${{ steps.package.outputs.tag }}-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Verify assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          ref="refs/tags/$TAG"
          remote_tag=$(git ls-remote --tags origin "$ref" "$ref^{}" | awk 'END {print $1}')
          if [[ -z "$remote_tag" ]]; then
            git push origin "$GITHUB_SHA:$ref"
          elif [[ "$remote_tag" != "$GITHUB_SHA" ]]; then
            echo "$TAG already points to a different commit" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            "dist/soju-rs-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/soju-rs-$TAG-x86_64-unknown-linux-musl.tar.gz" dist/SHA256SUMS
