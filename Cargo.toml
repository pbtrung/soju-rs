[package]
name = "soju"
version = "0.99.25"
edition = "2024"
rust-version = "1.100"
description = "A user-friendly IRC bouncer (Rust port of soju)"
license = "AGPL-3.0-only"
repository = "https://github.com/pbtrung/soju-rs"
readme = "README.md"
default-run = "soju"

[lib]
name = "soju"
path = "src/lib.rs"

[[bin]]
name = "soju"
path = "src/bin/soju.rs"

[[bin]]
name = "sojuctl"
path = "src/bin/sojuctl.rs"

[[bench]]
name = "reader"
path = "src/bench/reader.rs"
harness = false
test = false

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
aws-lc-rs = "1.19.0"
base64 = "0.23.1"
bcrypt = "0.19.3"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indexmap = "2.14.2"
ipnet = "2.12.2"
jiff = "1.0.0"
libc = "0.2.191"
mimalloc = "0.1.52"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
rand = "0.10.4"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "cache", "functions"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
time = "0.3.55"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "parking_lot",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
webpki-roots = "1.0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

# Practical compiler/Clippy baseline completed in STEP-011.
# Preserve reasoned local contracts; do not weaken the baseline for new code.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unused_imports = "deny"
unused_variables = "deny"
unreachable_code = "deny"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
allow_attributes = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

unwrap_used = "deny"
expect_used = "deny"

indexing_slicing = "deny"
string_slice = "deny"
map_err_ignore = "deny"
