[package]
name = "soju"
version = "0.99.10"
edition = "2024"
description = "A user-friendly IRC bouncer (Rust port of soju)"
license = "AGPL-3.0-only"
repository = "https://github.com/pbtrung/soju-rs"
readme = "README.md"
default-run = "soju"

[lib]
name = "soju"
path = "src/lib.rs"

[[bin]]
name = "soju"
path = "src/bin/soju.rs"

[[bin]]
name = "sojuctl"
path = "src/bin/sojuctl.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = "0.4.45"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
hkdf = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indexmap = "2.14.2"
ipnet = "2.12.2"
libc = "0.2.191"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
socket2 = "0.6.5"
time = "0.3.55"
tokio = { version = "1.54.0", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
webpki-roots = "1.0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tokio = { version = "1.54.0", features = ["full", "test-util"] }
