[package]
name = "soju"
version = "0.99.0"
edition = "2024"
rust-version = "1.88"
description = "A user-friendly IRC bouncer (Rust port of soju)"
license = "AGPL-3.0-only"
repository = "https://github.com/pbtrung/soju-rs"
readme = "README.md"
default-run = "soju"

[lib]
name = "soju"
path = "src/lib.rs"

[[bin]]
name = "soju"
path = "src/bin/soju.rs"

[[bin]]
name = "sojuctl"
path = "src/bin/sojuctl.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = "0.4.45"
gethostname = "1.1.0"
indexmap = "2.14.2"
ipnet = "2.12.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
